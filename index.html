<script>
  const logEl = document.getElementById("log");
  const inputEl = document.getElementById("msg");
  const sendBtn = document.getElementById("send");

  // =========================
  // Persistencia (1 vez)
  // =========================
  const LS_KEY = "bot_apoyo_gratis_v1";
  function loadState() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }
  function saveState() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {}
  }

  const defaultState = {
    nombre_usuario: null,
    genero: "indeterminado",
    nombre_conocido: false,
    presented: false,          // <- presentación 1 vez
    turns: 0
  };

  const state = loadState() || { ...defaultState };

  // =========================
  // Utilidades
  // =========================
  function addLine(text, cls) {
    const p = document.createElement("div");
    p.className = "line " + (cls || "");
    p.textContent = text;
    logEl.appendChild(p);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function norm(s) {
    return (s || "").trim().toLowerCase();
  }

  const GREETINGS = new Set([
    "hola","holaa","buenas","buenos dias","buenas tardes","buenas noches",
    "hi","hello","hey","wena","wenas","ola","holi"
  ]);

  const SMALLTALK = [
    "¿Cómo te va hoy?",
    "¿Cómo has estado?",
    "¿Qué tal tu día?",
    "¿En qué te ayudo?"
  ];

  const INFORMAL_GREETINGS = [
    "¡Hola!",
    "¡Buenas!",
    "¡Hey!",
    "¡Qué tal!",
    "¡Wena!"
  ];

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function detectarGenero(nombre) {
    const n = norm(nombre);
    if (n.endsWith("o")) return "masculino";
    if (n.endsWith("a")) return "femenino";
    return "indeterminado";
  }

  function pronombreReflexivo(genero) {
    if (genero === "masculino") return "ti mismo";
    if (genero === "femenino") return "ti misma";
    return "ti";
  }

  function esProbableNombre(msg) {
    // Regla simple y práctica:
    // - 1 palabra
    // - letras (incluye acentos/ñ)
    // - no es saludo
    // - largo razonable
    const t = (msg || "").trim();
    const e = norm(t);
    if (!t) return false;
    if (GREETINGS.has(e)) return false;
    // una sola palabra
    if (t.split(/\s+/).length !== 1) return false;
    // solo letras
    if (!/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+$/.test(t)) return false;
    if (t.length < 2 || t.length > 18) return false;
    return true;
  }

  // =========================
  // Lógica del bot
  // =========================
  function introOnce() {
    state.presented = true;
    saveState();
    return [
      "Hola 😊 ¿Cómo te va? ¿Cómo has estado?",
      "Me presento: soy **Bot Apoyo Gratis**.",
      "¿En qué te ayudo hoy?"
    ].join("\n");
  }

  function saludoVariante(nombre) {
    const hi = pick(INFORMAL_GREETINGS);
    const tail = pick(SMALLTALK);
    if (nombre) return `${hi} ${nombre}. ${tail}`;
    return `${hi} ${tail}`;
  }

  function responder(msg) {
    state.turns++;
    const t = (msg || "").trim();
    const e = norm(t);

    // 0) Presentación SOLO la primera vez (aunque el usuario diga cualquier cosa)
    if (!state.presented) {
      return introOnce();
    }

    // 1) Si el usuario saluda, responde saludo informal (no registra nombre)
    if (GREETINGS.has(e)) {
      return saludoVariante(state.nombre_usuario);
    }

    // 2) Si aún no tenemos nombre y el input parece nombre → registrar
    if (!state.nombre_conocido && esProbableNombre(t)) {
      state.nombre_usuario = t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
      state.nombre_conocido = true;
      state.genero = detectarGenero(state.nombre_usuario);
      saveState();
      return `Genial, ${state.nombre_usuario}. ${pick(SMALLTALK)}`;
    }

    // 3) Respuestas simples (sin ponerse místico)
    const nombre = state.nombre_usuario ? state.nombre_usuario : "";
    if (e.includes("mal") || e.includes("cans") || e.includes("estres") || e.includes("ansio")) {
      return `${nombre ? nombre + ", " : ""}te leo. ¿Qué es lo que más te está pesando ahora: mente, cuerpo o una situación?`;
    }

    if (e.includes("gracias")) {
      return `${nombre ? "De nada, " + nombre + "." : "De nada."} ¿Seguimos?`;
    }

    // 4) Default: pregunta útil
    return `${nombre ? nombre + ", " : ""}cuéntame un poco más: ¿qué pasó o qué necesitas resolver ahora?`;
  }

  function send() {
    const v = inputEl.value;
    inputEl.value = "";
    if (!v) return;

    addLine("tú: " + v, "u");
    const out = responder(v);
    addLine("bot: " + out, "b");
    inputEl.focus();
  }

  // UI events
  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      send();
    }
  });

  // Mensaje inicial (sin profundidad, y coherente con "presentación 1 vez")
  addLine("Sistema listo. Escribe “hola” para iniciar.", "b");
</script>
