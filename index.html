     <script>
  const logEl = document.getElementById("log");
  const inputEl = document.getElementById("msg");
  const sendBtn = document.getElementById("send");

  const state = {
    nombre_usuario: null,
    genero: "indeterminado",
    nombre_conocido: false,
    last_reply: "",
    turn: 0
  };

  function detectarGenero(nombre) {
    const n = (nombre || "").toLowerCase();
    if (n.endsWith("o")) return "masculino";
    if (n.endsWith("a")) return "femenino";
    return "indeterminado";
  }

  function pronombreReflexivo(genero) {
    if (genero === "masculino") return "ti mismo";
    if (genero === "femenino") return "ti misma";
    return "ti";
  }

  function addLine(text, cls) {
    const p = document.createElement("div");
    p.className = "line " + (cls || "");
    p.textContent = text;
    logEl.appendChild(p);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // --- Pools de respuesta (cortos, humanos, no “disco rayado”) ---
  const RESP_SALUDO = [
    "Te leo. ¿Qué está pasando ahora, en una frase?",
    "Ok. ¿Quieres desahogarte o ordenar ideas?",
    "Estoy aquí. ¿Qué necesitas de este espacio hoy?"
  ];

  const RESP_CALMA = [
    "Respira 10 segundos: inhalas 4, sostienes 2, exhalas 6.",
    "Baja la velocidad un 10%. Solo eso.",
    "Nota 3 cosas: un sonido, una sensación, un punto de apoyo."
  ];

  const RESP_FOCO = [
    "Vamos a lo concreto: ¿qué parte de esto sí está bajo tu control hoy?",
    "Elige un micro-paso de 1% para los próximos 5 minutos.",
    "¿Qué sería una versión un poquito más ordenada de este momento?"
  ];

  const RESP_DECISION = [
    "Dame 2 opciones. Luego vemos costo y beneficio de cada una.",
    "¿Qué dato te falta para decidir con calma?",
    "Si decides hoy: ¿qué es lo peor razonable que podría pasar?"
  ];

  const RESP_CIERRE = [
    "Si te sirve, nos quedamos con una cosa simple y seguimos.",
    "No hay que resolver todo ahora. Solo mantenerte cerca de lo real.",
    "Ok. Un paso a la vez."
  ];

  function pickDifferent(arr) {
    if (!arr || arr.length === 0) return "";
    if (arr.length === 1) return arr[0];
    let r = arr[Math.floor(Math.random() * arr.length)];
    if (r === state.last_reply) {
      const idx = (arr.indexOf(r) + 1) % arr.length;
      r = arr[idx];
    }
    state.last_reply = r;
    return r;
  }

  function classify(text) {
    const t = (text || "").toLowerCase().trim();
    if (!t) return "calma";
    if (/(hola|buenas|hey|hello)/.test(t)) return "saludo";
    if (/(decidir|elige|opción|opciones|qué hago|recomienda|prioriza|ayúdame a elegir)/.test(t)) return "decision";
    if (/(ansiedad|miedo|pena|triste|rabia|estres|estrés|pánico|angustia|cansad)/.test(t)) return "calma";
    return "foco";
  }

  function iniciarProtocolo(msg) {
    const t = (msg || "").trim();
    state.turn++;

    // 1) Captura nombre (solo la primera vez)
    if (!state.nombre_conocido) {
      if (!t) return "Nota por un momento si quieres nombrar este espacio.";
      state.nombre_usuario = t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
      state.nombre_conocido = true;
      state.genero = detectarGenero(state.nombre_usuario);

      const nombre = state.nombre_usuario;
      // primera respuesta: bienvenida + una sola guía corta (no siempre “descansa…”)
      return `Registrado, ${nombre}. ${pickDifferent(RESP_SALUDO)}`;
    }

    const nombre = state.nombre_usuario || "humano";
    const kind = classify(t);

    // 2) Respuesta por intención + variación
    if (kind === "saludo") {
      return `${pickDifferent(RESP_SALUDO)} (${nombre})`;
    }

    if (kind === "decision") {
      return `${pickDifferent(RESP_DECISION)} (${nombre})`;
    }

    if (kind === "calma") {
      // alterna calma / cierre para no repetir patrón
      const base = (state.turn % 2 === 0) ? pickDifferent(RESP_CALMA) : pickDifferent(RESP_CIERRE);
      return `${base} (${nombre})`;
    }

    // foco (default útil)
    return `${pickDifferent(RESP_FOCO)} (${nombre})`;
  }

  function send() {
    const v = inputEl.value;
    inputEl.value = "";
    if (!v) return;
    addLine("tú: " + v, "u");
    const out = iniciarProtocolo(v);
    addLine("bot: " + out, "b");
    inputEl.focus();
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      send();
    }
  });

  addLine("Sistema listo. Escribe tu nombre para iniciar.", "b");
     </script>
